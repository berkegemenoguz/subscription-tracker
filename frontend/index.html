<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abonelik Takip Yöneticisi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Abonelik Takip Yöneticisi</h1>
  </header>

  <main>
    <section id="summary-section">
      <div class="summary-card">
        <h3>Aylık Toplam</h3>
        <p id="monthly-total">₺0.00</p>
      </div>
      <div class="summary-card">
        <h3>Yıllık Toplam</h3>
        <p id="yearly-total">₺0.00</p>
      </div>
      <div class="summary-card">
        <h3>Tahmini Aylık</h3>
        <p id="estimated-monthly">₺0.00</p>
      </div>
    </section>

    <section id="form-section">
      <h2 id="form-title">Yeni Abonelik Ekle</h2>
      <div id="form-errors"></div>
      <form id="subscription-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Ad</label>
            <input type="text" id="name" name="name" placeholder="Örn: Netflix" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="price">Fiyat</label>
            <input type="number" id="price" name="price" step="0.01" min="0.01" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label for="cycle">Döngü</label>
            <select id="cycle" name="cycle" required>
              <option value="monthly">Aylık</option>
              <option value="yearly">Yıllık</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="start_date">Başlangıç Tarihi</label>
            <input type="date" id="start_date" name="start_date" required>
          </div>
          <div class="form-group">
            <label for="status">Durum</label>
            <select id="status" name="status">
              <option value="active">Aktif</option>
              <option value="cancelled">İptal</option>
            </select>
          </div>
        </div>
        <div class="form-group full-width">
          <label for="notes">Notlar</label>
          <textarea id="notes" name="notes" rows="2" placeholder="İsteğe bağlı notlar..."></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn">Ekle</button>
          <button type="button" id="cancel-btn" style="display:none;">İptal</button>
        </div>
      </form>
    </section>

    <section id="list-section">
      <h2>Abonelikler</h2>
      <div id="empty-message" style="display:none;">Henüz abonelik eklenmemiş.</div>
      <table id="subscriptions-table" style="display:none;">
        <thead>
          <tr>
            <th>Ad</th>
            <th>Fiyat</th>
            <th>Döngü</th>
            <th>Başlangıç</th>
            <th>Durum</th>
            <th>İşlemler</th>
          </tr>
        </thead>
        <tbody id="subscriptions-body"></tbody>
      </table>
    </section>

    <section id="calendar-section">
      <h2>12 Aylık Harcama Takvimi</h2>
      <div id="calendar-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
